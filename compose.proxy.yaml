services:
  docker-proxy:
    image: tecnativa/docker-socket-proxy
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - CONTAINERS=1 # Permite listar y ver info de contenedores
      - IMAGES=1     # Permite listar imágenes
      - POST=1       # Permite hacer pull de imágenes (la app actualiza imágenes)

  image-checker:
    image: difagume/image-checker:1.0.30
    restart: always
    volumes:
      - notifications-data:/app/data # Persistent storage for notification state
    environment:
      - NODE_ENV=production
      - DOCKER_HOST=tcp://docker-proxy:2375
      - TZ=${TZ}
      - AUTH_SESSION_PASSWORD=${AUTH_SESSION_PASSWORD}
      - AUTH_HTPASSWD=${AUTH_HTPASSWD}
      # En Dokploy (o cualquier .env): escribe el valor con COMILLAS SIMPLES para que
      # el $ del hash no se interprete como variable. Ejemplo en la pestaña "Variables":
      # AUTH_HTPASSWD='admin:$2a$10$LX4B3Vt2v9Vj2v9Vj2v9V.3v9Vj2v9Vj2v9Vj2v9Vj2v9Vj2v9Vj6'
      - GITHUB_GHCR_TOKEN=${GITHUB_GHCR_TOKEN}
      - NOTIFICATIONS_ENABLED=${NOTIFICATIONS_ENABLED}
      - NOTIFICATIONS_CRON_SCHEDULE=${NOTIFICATIONS_CRON_SCHEDULE}
      - TELEGRAM_ENABLED=${TELEGRAM_ENABLED}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      # Chat(s) autorizados para el botón "Actualizar". Varios separados por comas:
      #   TELEGRAM_CHAT_ID=123456789,@micanal
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      # URL interna de revalidación (opcional). Solo si la app no escucha en 127.0.0.1
      - INTERNAL_REVALIDATE_URL=${INTERNAL_REVALIDATE_URL}
    depends_on:
      - docker-proxy

volumes:
  notifications-data:
