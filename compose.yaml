services:
  dashboard:
    build: .
    user: "1001:0" # nextjs + grupo del socket (root) para poder leer Docker
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./notifications-data:/app/data  # Persistent storage
    environment:
      - NODE_ENV=production
